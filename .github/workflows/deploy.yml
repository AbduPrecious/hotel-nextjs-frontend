name: Deploy Hotel Website App

on:
  push:
    branches:
      - main # Change this if your default branch is 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /var/www/hotel-website/hotel-nextjs-frontend
            git pull origin main
            # This rebuilds only what changed and restarts the container
            docker compose up -d --build
            # Optional: Clean up old unused images to save disk space
            docker image prune -f
